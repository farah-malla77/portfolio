                                </p>
                                <div class="mt-4">
                                    <span class="fw-bold">Technologies Used: </span>
                                    <p class="open-sans-font d-inline techno-para" id="project-technical"> Loading...</p>
                                </div>
                                <div class="value d-flex mt-3">
                                    <span class="fw-bold">Link: </span>
                                    <a class="open-sans-font" id="project-tools"> Loading...</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Boxes Ends -->
            </div>
            <hr class="separator">
        </div>
    </section>

    <script>
        // Fetch the image data from the JSON file
        fetch('imageData.json')
            .then(response => response.json())
            .then(data => {
                // Get the image ID from the query parameter
                const urlParams = new URLSearchParams(window.location.search);
                const imageId = parseInt(urlParams.get('id'));

                // Find the corresponding image data
                const image = data.find(img => img.id === imageId);

                if (image) {
                    // Update the project title
                    document.getElementById('project-title').textContent = image.name;

                    // Update the mobile image
                    document.getElementById('mobile-img').src = image.imageUrl;

                    // Update the carousel
                    const carouselInner = document.getElementById('carousel-inner');
                    const carouselIndicators = document.getElementById('carousel-indicators');

                    image.images.forEach((img, index) => {
                        // Add carousel item
                        const carouselItem = document.createElement('div');
                        carouselItem.classList.add('carousel-item');
                        if (index === 0) carouselItem.classList.add('active');
                        carouselItem.innerHTML = `<img src="${img}" alt="slide ${index + 1}">`;
                        carouselInner.appendChild(carouselItem);

                        // Add carousel indicator
                        const indicator = document.createElement('li');
                        indicator.setAttribute('data-target', '#slider');
                        indicator.setAttribute('data-slide-to', index);
                        if (index === 0) indicator.classList.add('active');
                        carouselIndicators.appendChild(indicator);
                    });

                    // Update the project description, technical, and tools
                    document.getElementById('project-description').textContent = ` ${image.description}`;
                    document.getElementById('project-technical').textContent = ` ${image.technical.join(', ')}`;
                    document.getElementById('project-tools').textContent = ` ${image.link}`;
                } else {
                    console.error('Image not found');
                }
            })
            .catch(error => console.error('Error loading image data:', error));
    </script>
