    <!-- Header Ends -->
    <!-- Page Title Starts -->
    <section class="title-section text-left text-sm-center revealator-slideup revealator-once revealator-delay1">
        <h1>my <span>portfolio</span></h1>
        <span class="title-bg">works</span>
    </section>
    <!-- Page Title Ends -->
    <!-- Main Content Starts -->
    <section class="main-content text-center revealator-slideup revealator-once revealator-delay1">
        <div id="grid-gallery" class="container grid-gallery">
            <!-- Portfolio Grid Starts -->
            <section class="grid-wrap">
                <ul class="row grid" id="gallery-grid">
                    <!-- Portfolio Item Starts -->
                    <script>
                        // Fetch the image data from the JSON file
                        fetch('./imageData.json')
                            .then(response => response.json())
                            .then(data => {
                                const galleryGrid = document.getElementById('gallery-grid');
                
                                // Generate gallery items dynamically
                                data.forEach(image => {
                                    const galleryItem = `
                                        <li>
                                            <figure>
                                                <a href="details.html?id=${image.id}">
                                                    <img src="${image.imageUrl}" alt="${image.name}" class="portfolio_img">
                                                    <div><span>${image.name}</span></div>
                                                </a>
                                            </figure>
                                        </li>
                                    `;
                                    galleryGrid.innerHTML += galleryItem;
                                });
                            })
                            .catch(error => console.error('Error loading image data:', error));
                    </script>
                </ul>
            </section>
            <!-- Portfolio Grid Ends -->
            <!-- Portfolio Details Starts -->
            <section class="slideshow">
                <ul>
                    <!-- Portfolio Item Detail Starts -->
                    <li>
                        <figure>
                            <!-- Project Details Starts -->
                            <figcaption>
                                <h3>Image Project</h3>
                            </figcaption>
                            <!-- Project Details Ends -->
                            <!-- Main Project Content Ends -->
                        </figure>
                    </li>
                    <!-- Portfolio Item Detail Ends -->
                    <!-- Portfolio Item Detail Starts -->
                    <li>
                        <figure>
                            <!-- Project Details Starts -->
                            <figcaption>

                    </li>
                    <!-- Portfolio Item Detail Ends -->
                    <!-- Portfolio Item Detail Starts -->
                    <li>
                        <figure>
                            <!-- Project Details Starts -->
                            <figcaption>
                                <h3>Slider Project</h3>
                            </figcaption>
                            <!-- Project Details Ends -->
                        </figure>
                    </li>
                    <!-- Portfolio Item Detail Ends -->
                    <!-- Portfolio Item Detail Starts -->
                    <li>
                        <figure>
                            <!-- Project Details Starts -->
                            <figcaption>
                                <h3>Local Video Project</h3>
                            </figcaption>
                            <!-- Project Details Ends -->
                            
                        </figure>
                    </li>
                    <!-- Portfolio Item Detail Ends -->
                </ul>
                <!-- Portfolio Navigation Starts -->
                <nav>
                    <span class="icon nav-prev"><img src="images/left-arrow-light.png" alt="previous"></span>
                    <span class="icon nav-next"><img src="images/right-arrow-light.png" alt="next"></span>
                    <span class="nav-close"><img src="images/close-button-light.png" alt="close"> </span>
                </nav>
                <!-- Portfolio Navigation Ends -->
            </section>
        </div>
